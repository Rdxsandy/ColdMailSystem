services:
  - type: web
    name: coldmail-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      # Resend HTTP API — required for email sending on Render (SMTP ports are blocked)
      - key: RESEND_API_KEY
        sync: false
      # The verified sender address from your Resend domain settings
      # Use "onboarding@resend.dev" for testing without a verified domain
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: FRONTEND_URL
        value: https://cold-mail-system-beryl.vercel.app
      - key: BACKEND_URL
        value: https://coldmail-backend-bw0h.onrender.com
